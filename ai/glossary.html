<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AI Terminology Glossary</title>
        <style>
            :root {
                --text: #1a1a2e;
                --muted: #555;
                --accent: #2d5a7b;
                --bg: #ffffff;
                --quote-bg: #f4f7fa;
                --divider: #e0e0e0;
                --card-hover: 0 3px 12px rgba(0, 0, 0, 0.1);
                --tag-bg: #e8eef3;
                --tag-active-bg: #2d5a7b;
                --tag-active-text: #fff;
                --search-bg: #f8f9fb;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: "Georgia", "Times New Roman", serif;
                color: var(--text);
                background: var(--bg);
                line-height: 1.75;
                max-width: 960px;
                margin: 0 auto;
                padding: 40px 24px 80px;
            }
            header {
                margin-bottom: 32px;
                border-bottom: 2px solid var(--accent);
                padding-bottom: 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .repo-link {
                font-family: "Menlo", "Consolas", monospace;
                font-size: 0.8rem;
                color: var(--accent);
                text-decoration: none;
                border: 1px solid var(--accent);
                padding: 6px 12px;
                border-radius: 4px;
                transition: background 0.2s, color 0.2s;
                white-space: nowrap;
            }
            .repo-link:hover {
                background: var(--accent);
                color: #fff;
            }
            h1 {
                font-size: 1.6rem;
                font-weight: 700;
                letter-spacing: -0.02em;
                color: var(--accent);
                margin-bottom: 6px;
            }
            .subtitle {
                font-size: 0.9rem;
                color: var(--muted);
                font-style: italic;
            }
            .search-container {
                position: sticky;
                top: 0;
                z-index: 100;
                background: var(--bg);
                padding: 16px 0 12px;
                border-bottom: 1px solid var(--divider);
                margin-bottom: 20px;
            }
            .search-box {
                position: relative;
            }
            .search-box input {
                width: 100%;
                padding: 12px 16px 12px 42px;
                font-family: "Menlo", "Consolas", monospace;
                font-size: 0.9rem;
                border: 1px solid var(--divider);
                border-radius: 6px;
                background: var(--search-bg);
                color: var(--text);
                outline: none;
                transition:
                    border-color 0.2s,
                    box-shadow 0.2s;
            }
            .search-box input:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(45, 90, 123, 0.1);
            }
            .search-box input::placeholder {
                color: #999;
            }
            .search-icon {
                position: absolute;
                left: 14px;
                top: 50%;
                transform: translateY(-50%);
                color: #999;
                font-size: 1rem;
                pointer-events: none;
            }
            .search-shortcut {
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                font-family: "Menlo", "Consolas", monospace;
                font-size: 0.7rem;
                color: #aaa;
                background: #eee;
                padding: 2px 6px;
                border-radius: 3px;
                border: 1px solid #ddd;
            }
            .stats-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 0.82rem;
                color: var(--muted);
                margin-bottom: 16px;
                font-family: "Menlo", "Consolas", monospace;
            }
            .stats-bar .count {
                font-weight: 700;
                color: var(--accent);
            }
            .view-toggle {
                display: flex;
                gap: 4px;
            }
            .view-toggle button {
                background: var(--tag-bg);
                border: 1px solid var(--divider);
                border-radius: 4px;
                padding: 4px 10px;
                font-family: "Menlo", "Consolas", monospace;
                font-size: 0.75rem;
                color: var(--muted);
                cursor: pointer;
                transition: all 0.15s;
            }
            .view-toggle button.active {
                background: var(--tag-active-bg);
                color: var(--tag-active-text);
                border-color: var(--tag-active-bg);
            }
            .filter-row {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-bottom: 24px;
            }
            .filter-pill {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 4px 12px;
                font-family: "Menlo", "Consolas", monospace;
                font-size: 0.72rem;
                border: 1px solid var(--divider);
                border-radius: 14px;
                background: var(--bg);
                color: var(--muted);
                cursor: pointer;
                transition: all 0.15s;
                white-space: nowrap;
                user-select: none;
            }
            .filter-pill:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .filter-pill.active {
                background: var(--tag-active-bg);
                color: var(--tag-active-text);
                border-color: var(--tag-active-bg);
            }
            .filter-pill .pill-count {
                font-size: 0.65rem;
                opacity: 0.7;
            }
            .filter-pill.active .pill-count {
                opacity: 0.9;
            }
            .section-header {
                font-size: 1.1rem;
                font-weight: 700;
                color: var(--text);
                margin-top: 36px;
                margin-bottom: 12px;
                padding-bottom: 6px;
                border-bottom: 1px solid var(--divider);
                display: flex;
                align-items: baseline;
                gap: 8px;
            }
            .section-header .section-count {
                font-size: 0.75rem;
                font-weight: 400;
                color: var(--muted);
                font-family: "Menlo", "Consolas", monospace;
            }
            .terms-grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .term-card {
                background: var(--bg);
                border: 1px solid var(--divider);
                border-radius: 6px;
                padding: 14px 18px;
                transition:
                    box-shadow 0.2s,
                    border-color 0.2s;
                cursor: default;
            }
            .term-card:hover {
                box-shadow: var(--card-hover);
                border-color: var(--accent);
            }
            .term-card .term-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 12px;
                margin-bottom: 6px;
            }
            .term-card .term-name {
                font-weight: 700;
                font-size: 0.95rem;
                color: var(--accent);
            }
            .term-card .term-id {
                font-family: "Menlo", "Consolas", monospace;
                font-size: 0.7rem;
                color: #bbb;
                flex-shrink: 0;
            }
            .term-card .term-explanation {
                font-size: 0.88rem;
                color: var(--text);
                line-height: 1.6;
            }
            .term-card .term-meta {
                display: flex;
                gap: 8px;
                margin-top: 8px;
                flex-wrap: wrap;
            }
            .term-card .term-tag {
                font-family: "Menlo", "Consolas", monospace;
                font-size: 0.68rem;
                padding: 2px 8px;
                border-radius: 10px;
                background: var(--tag-bg);
                color: var(--muted);
            }
            .terms-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.85rem;
            }
            .terms-table th,
            .terms-table td {
                text-align: left;
                padding: 10px 14px;
                border: 1px solid var(--divider);
                vertical-align: top;
            }
            .terms-table th {
                background: var(--quote-bg);
                font-weight: 700;
                color: var(--accent);
                position: sticky;
                top: 62px;
                z-index: 50;
            }
            .terms-table tr:hover td {
                background: var(--quote-bg);
            }
            .terms-table .col-id {
                width: 40px;
                text-align: center;
                color: #bbb;
                font-family: "Menlo", monospace;
                font-size: 0.75rem;
            }
            .terms-table .col-term {
                width: 180px;
                font-weight: 700;
                color: var(--accent);
            }
            .terms-table .col-tag {
                width: 110px;
            }
            .terms-table .col-tag span {
                font-family: "Menlo", monospace;
                font-size: 0.72rem;
                padding: 2px 6px;
                background: var(--tag-bg);
                border-radius: 8px;
                color: var(--muted);
            }
            mark {
                background: rgba(45, 90, 123, 0.15);
                color: inherit;
                padding: 0 1px;
                border-radius: 2px;
            }
            .empty-state {
                text-align: center;
                padding: 60px 20px;
                color: var(--muted);
                font-style: italic;
            }
            .empty-state .empty-icon {
                font-size: 2rem;
                margin-bottom: 12px;
                opacity: 0.4;
            }
            .hidden {
                display: none !important;
            }
            @media (max-width: 600px) {
                body {
                    padding: 20px 12px 48px;
                }
                h1 {
                    font-size: 1.3rem;
                }
                .filter-row {
                    gap: 4px;
                }
                .filter-pill {
                    font-size: 0.65rem;
                    padding: 3px 8px;
                }
                .term-card {
                    padding: 10px 14px;
                }
                .terms-table {
                    font-size: 0.78rem;
                }
                .terms-table th,
                .terms-table td {
                    padding: 6px 8px;
                }
                .search-shortcut {
                    display: none;
                }
            }
            @media (min-width: 700px) {
                .terms-grid {
                    grid-template-columns: 1fr 1fr;
                    gap: 12px;
                }
            }
            @media print {
                .search-container,
                .filter-row,
                .stats-bar,
                .view-toggle {
                    display: none;
                }
                .term-card {
                    break-inside: avoid;
                    border: 1px solid #ccc;
                }
                body {
                    max-width: 100%;
                    padding: 0;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <div>
                <h1>AI Terminology Glossary</h1>
                <p class="subtitle">
                    289 terms across 25 categories &mdash; April 2026
                </p>
            </div>
            <a href="https://github.com/ThibautBaissac/rails_ai_agents" class="repo-link" target="_blank" rel="noopener noreferrer">GitHub Repo</a>
        </header>
        <div class="search-container">
            <div class="search-box">
                <span class="search-icon">&#x1F50D;</span>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search terms, explanations, categories..."
                    autocomplete="off"
                />
                <span class="search-shortcut">/</span>
            </div>
        </div>
        <div class="stats-bar">
            <span
                >Showing <span class="count" id="resultCount">289</span> of 289
                terms</span
            >
            <div class="view-toggle">
                <button
                    id="viewCards"
                    class="active"
                    onclick="setView('cards')"
                >
                    Cards
                </button>
                <button id="viewTable" onclick="setView('table')">Table</button>
            </div>
        </div>
        <div class="filter-row" id="filterRow"></div>
        <div id="cardsView"><div id="termsContainer"></div></div>
        <div id="tableView" class="hidden">
            <table class="terms-table">
                <thead>
                    <tr>
                        <th class="col-id">#</th>
                        <th class="col-term">Term</th>
                        <th>Explanation</th>
                        <th class="col-tag">Category</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="empty-state hidden" id="emptyState">
            <div class="empty-icon">&#x1F50D;</div>
            <p>No terms match your search.</p>
            <p style="font-size: 0.85rem; margin-top: 8px">
                Try a different keyword or clear the filters.
            </p>
        </div>
        <script>
            const TERMS = [
                {
                    id: 1,
                    term: "Artificial Intelligence (AI)",
                    explanation:
                        "The broad field of computer science focused on creating systems capable of performing tasks that typically require human intelligence, such as reasoning, learning, perception, and decision-making.",
                    tag: "Core AI/ML",
                    section: "Core AI/ML Foundations",
                    sectionNum: 1,
                },
                {
                    id: 2,
                    term: "Machine Learning (ML)",
                    explanation:
                        "A subset of AI where systems learn patterns from data and improve performance on tasks without being explicitly programmed, using statistical techniques to generalize from examples.",
                    tag: "Core AI/ML",
                    section: "Core AI/ML Foundations",
                    sectionNum: 1,
                },
                {
                    id: 3,
                    term: "Deep Learning",
                    explanation:
                        'A subset of machine learning that uses artificial neural networks with multiple layers (hence "deep") to learn hierarchical representations of data. Powers most modern AI breakthroughs.',
                    tag: "Core AI/ML",
                    section: "Core AI/ML Foundations",
                    sectionNum: 1,
                },
                {
                    id: 4,
                    term: "Neural Network",
                    explanation:
                        "A computational model inspired by the human brain, consisting of interconnected layers of nodes (neurons) that process and transform input data through weighted connections and activation functions.",
                    tag: "Core AI/ML",
                    section: "Core AI/ML Foundations",
                    sectionNum: 1,
                },
                {
                    id: 5,
                    term: "Supervised Learning",
                    explanation:
                        "A machine learning paradigm where models are trained on labeled data (input-output pairs), learning to map inputs to correct outputs. Used for classification and regression tasks.",
                    tag: "Core AI/ML",
                    section: "Core AI/ML Foundations",
                    sectionNum: 1,
                },
                {
                    id: 6,
                    term: "Unsupervised Learning",
                    explanation:
                        "A machine learning paradigm where models find patterns in unlabeled data without predefined outputs. Includes clustering, dimensionality reduction, and density estimation.",
                    tag: "Core AI/ML",
                    section: "Core AI/ML Foundations",
                    sectionNum: 1,
                },
                {
                    id: 7,
                    term: "Reinforcement Learning (RL)",
                    explanation:
                        "A learning paradigm where an agent learns optimal behavior by interacting with an environment, receiving rewards or penalties for actions, and maximizing cumulative reward over time.",
                    tag: "Core AI/ML",
                    section: "Core AI/ML Foundations",
                    sectionNum: 1,
                },
                {
                    id: 8,
                    term: "Transfer Learning",
                    explanation:
                        "A technique where a model trained on one task is repurposed as the starting point for a model on a different but related task, leveraging previously learned features to reduce training time and data requirements.",
                    tag: "Core AI/ML",
                    section: "Core AI/ML Foundations",
                    sectionNum: 1,
                },
                {
                    id: 9,
                    term: "Natural Language Processing (NLP)",
                    explanation:
                        "The branch of AI focused on enabling computers to understand, interpret, generate, and interact with human language in useful ways.",
                    tag: "Core AI/ML",
                    section: "Core AI/ML Foundations",
                    sectionNum: 1,
                },
                {
                    id: 10,
                    term: "Computer Vision",
                    explanation:
                        "The field of AI that enables machines to interpret and understand visual information from images and video, including object detection, image classification, and scene understanding.",
                    tag: "Core AI/ML",
                    section: "Core AI/ML Foundations",
                    sectionNum: 1,
                },
                {
                    id: 11,
                    term: "Transformer",
                    explanation:
                        'The dominant neural network architecture (introduced in the 2017 paper "Attention Is All You Need") that uses self-attention mechanisms to process sequential data in parallel. Powers virtually all modern LLMs and many vision models.',
                    tag: "Architecture",
                    section: "Transformer Architecture & LLM Internals",
                    sectionNum: 2,
                },
                {
                    id: 12,
                    term: "Self-Attention",
                    explanation:
                        "A mechanism within transformers that allows each token in a sequence to compute relevance scores against every other token, enabling the model to understand contextual relationships regardless of distance in the input.",
                    tag: "Architecture",
                    section: "Transformer Architecture & LLM Internals",
                    sectionNum: 2,
                },
                {
                    id: 13,
                    term: "Multi-Head Attention",
                    explanation:
                        'An extension of self-attention where the model runs multiple attention computations in parallel (each "head" learns different relationship patterns), then concatenates the results for richer representations.',
                    tag: "Architecture",
                    section: "Transformer Architecture & LLM Internals",
                    sectionNum: 2,
                },
                {
                    id: 14,
                    term: "Token",
                    explanation:
                        'The basic unit of text that an LLM processes. A token can represent a character, sub-word, word, or short phrase depending on the tokenizer. For example, "understanding" might be split into "under" + "standing".',
                    tag: "Architecture",
                    section: "Transformer Architecture & LLM Internals",
                    sectionNum: 2,
                },
                {
                    id: 15,
                    term: "Tokenization",
                    explanation:
                        "The process of converting raw text into a sequence of tokens that a model can process. Common tokenizers include Byte-Pair Encoding (BPE), WordPiece, and SentencePiece.",
                    tag: "Architecture",
                    section: "Transformer Architecture & LLM Internals",
                    sectionNum: 2,
                },
                {
                    id: 16,
                    term: "Context Window",
                    explanation:
                        'The maximum number of tokens an LLM can consider at once during inference. Determines how much text the model can "see" and reason about in a single interaction. Modern models range from 4K to 1M+ tokens.',
                    tag: "Architecture",
                    section: "Transformer Architecture & LLM Internals",
                    sectionNum: 2,
                },
                {
                    id: 17,
                    term: "Embedding",
                    explanation:
                        "A dense, fixed-dimensional vector representation of data (text, images, etc.) in a continuous space where semantically similar items are positioned closer together. Embeddings are fundamental to search, retrieval, and similarity tasks.",
                    tag: "Architecture",
                    section: "Transformer Architecture & LLM Internals",
                    sectionNum: 2,
                },
                {
                    id: 18,
                    term: "Positional Encoding",
                    explanation:
                        "A technique that injects information about the position of tokens in a sequence into the model, since transformers (unlike RNNs) process all tokens simultaneously and have no inherent sense of order.",
                    tag: "Architecture",
                    section: "Transformer Architecture & LLM Internals",
                    sectionNum: 2,
                },
                {
                    id: 19,
                    term: "KV Cache (Key-Value Cache)",
                    explanation:
                        "A memory optimization for autoregressive LLMs that stores previously computed key and value tensors from the attention mechanism, avoiding redundant computation when generating each new token. A critical target for inference optimization.",
                    tag: "Architecture",
                    section: "Transformer Architecture & LLM Internals",
                    sectionNum: 2,
                },
                {
                    id: 20,
                    term: "Softmax",
                    explanation:
                        "A mathematical function used in the attention mechanism (and output layer) that converts raw scores into a probability distribution, ensuring all attention weights sum to 1.",
                    tag: "Architecture",
                    section: "Transformer Architecture & LLM Internals",
                    sectionNum: 2,
                },
                {
                    id: 21,
                    term: "Large Language Model (LLM)",
                    explanation:
                        "A deep learning model trained on massive text corpora (billions to trillions of tokens) that can understand, generate, translate, and reason about human language. Examples: GPT-4, Claude, Llama, Gemini.",
                    tag: "Model Types",
                    section: "Model Types & Architectures",
                    sectionNum: 3,
                },
                {
                    id: 22,
                    term: "Foundation Model",
                    explanation:
                        'A large-scale, pre-trained AI model trained on broad data that can be adapted to a wide range of downstream tasks through fine-tuning or prompting. The term emphasizes that these models serve as a base ("foundation") for many applications.',
                    tag: "Model Types",
                    section: "Model Types & Architectures",
                    sectionNum: 3,
                },
                {
                    id: 23,
                    term: "Frontier Model",
                    explanation:
                        "A general-purpose AI model trained at extreme computational scale (typically >10^26 FLOPs) that pushes the state-of-the-art in capabilities. In 2026, the concept has fractured into regulatory frontier, efficiency frontier, and cost frontier.",
                    tag: "Model Types",
                    section: "Model Types & Architectures",
                    sectionNum: 3,
                },
                {
                    id: 24,
                    term: "Small Language Model (SLM)",
                    explanation:
                        "A language model with a smaller parameter count (typically <10B parameters) optimized for efficiency, edge deployment, and specific tasks. Trades some generality for speed and lower resource requirements. Examples: Phi-3, Gemma.",
                    tag: "Model Types",
                    section: "Model Types & Architectures",
                    sectionNum: 3,
                },
                {
                    id: 25,
                    term: "Vision Language Model (VLM)",
                    explanation:
                        "A model that jointly processes visual and textual information, enabling tasks like image captioning, visual question answering, and document understanding. Examples: GPT-4V, Claude Vision, LLaVA.",
                    tag: "Model Types",
                    section: "Model Types & Architectures",
                    sectionNum: 3,
                },
                {
                    id: 26,
                    term: "Mixture of Experts (MoE)",
                    explanation:
                        'An architecture where a model contains multiple specialized sub-networks ("experts") and a gating mechanism routes each input to only a subset of experts. This allows massive total parameter counts while keeping per-inference computation manageable. Used by DeepSeek-R1, Mixtral, and others.',
                    tag: "Model Types",
                    section: "Model Types & Architectures",
                    sectionNum: 3,
                },
                {
                    id: 27,
                    term: "Reasoning Model",
                    explanation:
                        'A model specifically trained (typically via reinforcement learning) to perform step-by-step logical reasoning before producing an answer. These models "think" through problems using chain-of-thought before responding. Examples: OpenAI o1/o3, DeepSeek-R1.',
                    tag: "Model Types",
                    section: "Model Types & Architectures",
                    sectionNum: 3,
                },
                {
                    id: 28,
                    term: "Generative Adversarial Network (GAN)",
                    explanation:
                        "An architecture with two networks -- a generator that creates synthetic data and a discriminator that distinguishes real from fake -- trained adversarially. Historically important for image generation; largely superseded by diffusion models for that task.",
                    tag: "Model Types",
                    section: "Model Types & Architectures",
                    sectionNum: 3,
                },
                {
                    id: 29,
                    term: "Variational Autoencoder (VAE)",
                    explanation:
                        "A generative model that learns a compressed latent representation of input data as a probability distribution, enabling smooth interpolation and generation of new samples. Often used as a component in larger systems like Stable Diffusion.",
                    tag: "Model Types",
                    section: "Model Types & Architectures",
                    sectionNum: 3,
                },
                {
                    id: 30,
                    term: "Diffusion Model",
                    explanation:
                        "A generative model that learns to create data by reversing a gradual noising process -- starting from pure noise and iteratively denoising to produce high-quality outputs (images, audio, video). Powers DALL-E, Stable Diffusion, Midjourney, and Sora.",
                    tag: "Model Types",
                    section: "Model Types & Architectures",
                    sectionNum: 3,
                },
                {
                    id: 31,
                    term: "Large Action Model (LAM)",
                    explanation:
                        "An emerging model type designed not just to generate text but to take actions in the real world or digital environments, such as controlling software, navigating websites, or operating tools autonomously.",
                    tag: "Model Types",
                    section: "Model Types & Architectures",
                    sectionNum: 3,
                },
                {
                    id: 32,
                    term: "Open-Weight Model",
                    explanation:
                        'A model whose trained parameters (weights) are publicly released for download and use, but may have restrictions on commercial use or modification. Distinct from fully "open-source" which also requires open training data and code. Examples: Llama, DeepSeek, Qwen.',
                    tag: "Model Types",
                    section: "Model Types & Architectures",
                    sectionNum: 3,
                },
                {
                    id: 33,
                    term: "Pre-training",
                    explanation:
                        "The initial, most compute-intensive phase of LLM training where the model learns general language understanding by predicting the next token across massive unlabeled text corpora (trillions of tokens). Creates the foundation of the model's knowledge.",
                    tag: "Training",
                    section: "Training Pipeline",
                    sectionNum: 4,
                },
                {
                    id: 34,
                    term: "Post-training",
                    explanation:
                        "All training stages that come after pre-training, including supervised fine-tuning, instruction tuning, RLHF, and other alignment techniques. Transforms a raw pre-trained model into a useful, safe assistant.",
                    tag: "Training",
                    section: "Training Pipeline",
                    sectionNum: 4,
                },
                {
                    id: 35,
                    term: "Supervised Fine-Tuning (SFT)",
                    explanation:
                        "The first post-training step where the model is trained on curated, high-quality input-output examples (typically human-written) to learn instruction-following behavior. Transforms a base model into an assistant.",
                    tag: "Training",
                    section: "Training Pipeline",
                    sectionNum: 4,
                },
                {
                    id: 36,
                    term: "Instruction Tuning",
                    explanation:
                        "A specialized form of fine-tuning that trains a model to follow natural language instructions and perform diverse tasks, using datasets of (instruction, response) pairs across many task types.",
                    tag: "Training",
                    section: "Training Pipeline",
                    sectionNum: 4,
                },

            const sections = [...new Set(TERMS.map((t) => t.section))];
            const sectionMap = {};
            TERMS.forEach((t) => {
                if (!sectionMap[t.section])
                    sectionMap[t.section] = { num: t.sectionNum, terms: [] };
                sectionMap[t.section].terms.push(t);
            });

            let activeFilters = new Set();
            let searchQuery = "";
            let currentView = "cards";

            const filterRow = document.getElementById("filterRow");
            const allPill = document.createElement("button");
            allPill.className = "filter-pill active";
            allPill.innerHTML =
                'All <span class="pill-count">' + TERMS.length + "</span>";
            allPill.onclick = () => {
                activeFilters.clear();
                updateFilters();
            };
            filterRow.appendChild(allPill);

            sections.forEach((sec) => {
                const count = sectionMap[sec].terms.length;
                const pill = document.createElement("button");
                pill.className = "filter-pill";
                pill.dataset.section = sec;
                pill.innerHTML =
                    sec + ' <span class="pill-count">' + count + "</span>";
                pill.onclick = () => toggleFilter(sec);
                filterRow.appendChild(pill);
            });

            function toggleFilter(section) {
                if (activeFilters.has(section)) activeFilters.delete(section);
                else activeFilters.add(section);
                updateFilters();
            }

            function updateFilters() {
                document.querySelectorAll(".filter-pill").forEach((p) => {
                    if (p.dataset.section)
                        p.classList.toggle(
                            "active",
                            activeFilters.has(p.dataset.section),
                        );
                    else p.classList.toggle("active", activeFilters.size === 0);
                });
                render();
            }

            const searchInput = document.getElementById("searchInput");
            searchInput.addEventListener("input", (e) => {
                searchQuery = e.target.value.trim().toLowerCase();
                render();
            });

            document.addEventListener("keydown", (e) => {
                if (e.key === "/" && document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                }
                if (
                    e.key === "Escape" &&
                    document.activeElement === searchInput
                ) {
                    searchInput.blur();
                    searchInput.value = "";
                    searchQuery = "";
                    render();
                }
            });

            function setView(view) {
                currentView = view;
                document
                    .getElementById("viewCards")
                    .classList.toggle("active", view === "cards");
                document
                    .getElementById("viewTable")
                    .classList.toggle("active", view === "table");
                document
                    .getElementById("cardsView")
                    .classList.toggle("hidden", view !== "cards");
                document
                    .getElementById("tableView")
                    .classList.toggle("hidden", view !== "table");
                render();
            }

            function highlight(text, query) {
                if (!query) return escapeHtml(text);
                const escaped = escapeHtml(text);
                const regex = new RegExp("(" + escapeRegex(query) + ")", "gi");
                return escaped.replace(regex, "<mark>$1</mark>");
            }
            function escapeHtml(s) {
                return s
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }
            function escapeRegex(s) {
                return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            function render() {
                const filtered = TERMS.filter((t) => {
                    if (activeFilters.size > 0 && !activeFilters.has(t.section))
                        return false;
                    if (searchQuery) {
                        const q = searchQuery;
                        return (
                            t.term.toLowerCase().includes(q) ||
                            t.explanation.toLowerCase().includes(q) ||
                            t.tag.toLowerCase().includes(q) ||
                            t.section.toLowerCase().includes(q)
                        );
                    }
                    return true;
                });
                document.getElementById("resultCount").textContent =
                    filtered.length;
                document
                    .getElementById("emptyState")
                    .classList.toggle("hidden", filtered.length > 0);
                document
                    .getElementById(
                        currentView === "cards" ? "cardsView" : "tableView",
                    )
                    .classList.toggle("hidden", filtered.length === 0);
                if (currentView === "cards") renderCards(filtered);
                else renderTable(filtered);
            }

            function renderCards(terms) {
                const container = document.getElementById("termsContainer");
                const grouped = {};
                terms.forEach((t) => {
                    if (!grouped[t.section]) grouped[t.section] = [];
                    grouped[t.section].push(t);
                });
                let html = "";
                sections.forEach((sec) => {
                    if (!grouped[sec]) return;
                    const items = grouped[sec];
                    html +=
                        '<div class="section-header">' +
                        sec +
                        ' <span class="section-count">' +
                        items.length +
                        " term" +
                        (items.length !== 1 ? "s" : "") +
                        "</span></div>";
                    html += '<div class="terms-grid">';
                    items.forEach((t) => {
                        html +=
                            '<div class="term-card">' +
                            '<div class="term-header"><span class="term-name">' +
                            highlight(t.term, searchQuery) +
                            '</span><span class="term-id">#' +
                            t.id +
                            "</span></div>" +
                            '<div class="term-explanation">' +
                            highlight(t.explanation, searchQuery) +
                            "</div>" +
                            '<div class="term-meta"><span class="term-tag">' +
                            highlight(t.tag, searchQuery) +
                            "</span></div>" +
                            "</div>";
                    });
                    html += "</div>";
                });
                container.innerHTML = html;
            }

            function renderTable(terms) {
                const tbody = document.getElementById("tableBody");
                let html = "";
                terms.forEach((t) => {
                    html +=
                        "<tr>" +
                        '<td class="col-id">' +
                        t.id +
                        "</td>" +
                        '<td class="col-term">' +
                        highlight(t.term, searchQuery) +
                        "</td>" +
                        "<td>" +
                        highlight(t.explanation, searchQuery) +
                        "</td>" +
                        '<td class="col-tag"><span>' +
                        highlight(t.tag, searchQuery) +
                        "</span></td>" +
                        "</tr>";
                });
                tbody.innerHTML = html;
            }

            render();
        </script>
